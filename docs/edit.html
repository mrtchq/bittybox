<!DOCTYPE html>
<html>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: 'self'; script-src cdnjs.cloudflare.com cdn.jsdelivr.net cdn.quilljs.com 'self'; connect-src https://codepen.io https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; style-src https://fonts.googleapis.com cdnjs.cloudflare.com cdn.jsdelivr.net cdn.quilljs.com 'unsafe-inline' 'self'">
<meta name="theme-color" content="#FCCD84">
<meta id="themeColor" name="theme-color" content="#FCCD84" media="(prefers-color-scheme: light)">
<meta id="themeColorDark" name="theme-color" content="#FCCD84" media="(prefers-color-scheme: dark)">
<link rel="canonical" id="canonical" href="/edit">

<title>Bitty Box</title>
<link rel="stylesheet" type="text/css" href="edit.css">
<link rel="manifest" href="/manifest.json">
<link id="favicon" rel="icon" type="image/svg+xml" href='/favicon.svg'>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/styles/default.min.css">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet"
      integrity="sha384-ecIckRi4QlKYya/FQUbBUjS4qp65jF/J87Guw5uzTbO1C1Jfa/6kYmd6dXUF6D7i"
      crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.min.js"
        integrity="sha384-reiVBUvj2HgLgCZalqLFSMBVD9LdtiwGyybRGCq2AfP8Rgebz5DxEnwKp4FpagKV"
        crossorigin="anonymous"></script>
<script src="/js/crypto-js.min.js"></script>
<script src="/js/lzma/lzma_worker-min.js"></script>
<script src="/js/qrious.min.js"></script>
<script src="/edit.js" type="module"></script>
<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">

<body>
<iframe class="hide-before-edit" id="preview-frame"></iframe>
<div id="preview-overlay" class="preview-overlay">
  <div class="preview-overlay-card">
    <div class="preview-overlay-header">
      <span class="preview-overlay-title">Preview URL Size</span>
      <span id="preview-overlay-bytes" class="preview-overlay-bytes">0 bytes</span>
    </div>
    <div class="preview-overlay-meter">
      <div id="preview-overlay-bar" class="preview-overlay-bar"></div>
    </div>
    <div id="preview-overlay-warning" class="preview-overlay-warning"></div>
  </div>
</div>
<div class="editor-container">
<div id="doc-file"></div>
<input id="file-input" type="file" name="name" style="display: none;" />
<div id="drop-zone"></div>

<div id="copy-message">Link copied to clipboard.</div>
<div id="toast" class="toast-message" style="display:none;"></div>




<div id="doc-title" class="toolbarbutton hide-before-edit" placeholder="untitled"> 
  <div class="title" id="doc-title-text"></div>
  <form id="md-contents" class="menu">
    <div class="inputrow"><label for="md-title">title</label><input type="text" name="title" id="md-title" placeholder="untitled"><input title="Include link metadata" type="checkbox" name="includeMetadata" id="md-include" value="true" checked></div>
    <div class="inputrow metadata-on"><label for="md-description">description</label><input type="text" name="description" id="md-description" placeholder="text"></div>
    <div class="inputrow metadata-on"><label for="md-favicon">favicon</label><input type="text" name="favicon" id="md-favicon" placeholder="emoji or url"></div>
    <div class="inputrow metadata-on"><label for="md-image">image</label><input type="text" name="image" id="md-image" placeholder="image url"></div>
    <div class="inputrow"><label for="md-password">password</label><input type="text" name="password" id="md-password" placeholder="encryption password"></div>
  </form>
</div>

<div id="placeholder">&nbsp;bitty box things<br>&nbsp;can be conveyed in a link.<br>&nbsp;type here &ndash; and then share!</div>

<div id="editor"></div>
</div>

<div class="dock-wrapper" id="dock-container">
  <!-- Expandable Rich Text Formatting Shelf -->
  <div id="dock-format-shelf" class="dock-format-shelf" aria-label="Rich Text Formatting Toolbar">
    <div class="toolbar" id="formatbar">
      <span class="ql-formats">
        <button class="ql-bold" title="Bold (Ctrl+B)"></button>
        <button class="ql-italic" title="Italic (Ctrl+I)"></button>
        <select class="ql-header" id="ql-header" title="Heading level">HX</select>
        <select class="ql-color" title="Text color"><option value="#F6D4D2"/><option value="#FAE4D3"/><option value="#FEF3D5"/><option value="#CFE8DC"/><option value="#CFE0E8"/><option value="#E1D7E8"/><option value="white"/><option value="#E99590"/><option value="#F3BB92"/><option value="#FDE095"/><option value="#86C6A8"/><option value="#86B1C6"/><option value="#B39BC6"/><option value="#A4A4A4"/><option value="#D42A20"/><option value="#E77625"/><option value="#FAC22B"/><option value="#0E8E51"/><option value="#0E638E"/><option value="#67378D"/><option value="#727272"/><option value="#BF0000"/><option value="#DB3F00"/><option value="#F8A600"/><option value="#005E12"/><option value="#00275E"/><option value="#2C005C"/><option value="#3D3D3D"/><option value="#860000"/><option value="#943E00"/><option value="#AE7400"/><option value="#00420D"/><option value="#001B42"/><option value="#1F0040"/><option value="black"/></select>
        <select class="ql-background" title="Background color"><option value="#F6D4D2"/><option value="#FAE4D3"/><option value="#FEF3D5"/><option value="#CFE8DC"/><option value="#CFE0E8"/><option value="#E1D7E8"/><option value="white"/><option value="#E99590"/><option value="#F3BB92"/><option value="#FDE095"/><option value="#86C6A8"/><option value="#86B1C6"/><option value="#B39BC6"/><option value="#A4A4A4"/><option value="#D42A20"/><option value="#E77625"/><option value="#FAC22B"/><option value="#0E8E51"/><option value="#0E638E"/><option value="#67378D"/><option value="#727272"/><option value="#BF0000"/><option value="#DB3F00"/><option value="#F8A600"/><option value="#005E12"/><option value="#00275E"/><option value="#2C005C"/><option value="#3D3D3D"/><option value="#860000"/><option value="#943E00"/><option value="#AE7400"/><option value="#00420D"/><option value="#001B42"/><option value="#1F0040"/><option value="black"/></select>
        <button class="ql-clean" title="Clear formatting"></button>
      </span>
      <span class="dock-shelf-divider"></span>
      <span class="ql-formats">
        <button class="ql-code-block" title="Code block"></button>
        <button class="ql-link" title="Insert link"></button>
        <select class="ql-align" title="Text alignment"></select>
        <button type="button" class="ql-list" value="bullet" title="Bullet list"></button>
        <button type="button" class="ql-list" value="ordered" title="Numbered list"></button>
        <button class="ql-indent" value="-1" title="Outdent"></button>
        <button class="ql-indent" value="+1" title="Indent"></button>
      </span>
    </div>
  </div>

  <!-- Floating Dock Island -->
  <nav class="dock-bar" id="menubar" aria-label="Editor actions dock">
    <!-- Group 1: Editor Controls -->
    <div class="dock-segment dock-segment-craft">
      <button type="button" id="format-toggle" class="dock-btn" title="Toggle rich text formatting shelf" aria-label="Toggle rich text formatting shelf" aria-expanded="false">
        <span class="dock-aa-icon">Aa</span>
        <span class="dock-btn-label">Format</span>
      </button>
      <button type="button" id="preview-toggle-btn" class="dock-btn" title="Toggle live preview split screen" aria-label="Toggle live preview">
        <svg class="dock-svg-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="dock-btn-label" id="preview-btn-text">Preview</span>
      </button>
    </div>

    <div class="dock-divider"></div>

    <!-- Group 2: Status, Sharing & Utilities -->
    <div class="dock-segment dock-segment-utils">
      <div id="autosave-status" class="dock-autosave" title="Draft auto-saved locally">
        <span class="dock-pulse-dot"></span>
        <span id="autosave-text" class="dock-autosave-text">Saved</span>
      </div>
      <button type="button" id="theme-btn" class="dock-btn" title="Toggle theme (Light / Dark)" aria-label="Toggle Light or Dark theme">
        <span id="theme-icon" class="dock-theme-icon">&#9790;</span>
        <span id="theme-text" class="dock-btn-label">Dark</span>
      </button>
      <button type="button" id="qr-btn" class="dock-btn hide-before-edit" title="Generate QR code for mobile sharing" aria-label="QR Code">
        <svg class="dock-svg-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="dock-btn-label">QR</span>
      </button>
      <div class="recent-wrapper">
        <button type="button" id="recent-btn" class="dock-btn" title="Recently edited projects" aria-label="Recent projects">
          <svg class="dock-svg-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="dock-btn-label">Recent</span>
        </button>
        <div id="recent-popover" class="recent-popover" style="display: none;">
          <div class="recent-header">
            <span class="recent-title-heading">Recently Edited</span>
            <button type="button" id="clear-recent-btn" class="recent-clear-btn" title="Clear recent history">Clear</button>
          </div>
          <ul id="recent-list" class="recent-list"></ul>
        </div>
      </div>
      <div id="length" class="dock-length-badge hide-before-edit" title="Click to open project link in new window" role="button" tabindex="0"></div>
    </div>
  </nav>
</div>

<dialog id="qr-modal" class="bitty-modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title-col">
        <h3 id="qr-modal-title" class="modal-title">Bitty Box Project</h3>
        <span id="qr-byte-count" class="modal-byte-badge"></span>
      </div>
      <button type="button" id="qr-modal-close" class="modal-close-btn" aria-label="Close dialog">&times;</button>
    </div>
    <div class="modal-body">
      <div class="qr-canvas-container">
        <canvas id="qr-canvas"></canvas>
      </div>
      <p class="qr-hint">Scan with your mobile camera to open this Bitty Box project directly on your device.</p>
      <div class="qr-actions">
        <button type="button" id="qr-copy-btn" class="modal-action-btn">Copy Link</button>
      </div>
    </div>
  </div>
</dialog>
</body>
</html>
