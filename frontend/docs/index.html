    <script>
      (() => {
        const gradientStops = [
          { pos: 0.00, color: '#d3b483' },
          { pos: 0.35, color: '#c29a5f' },
          { pos: 0.70, color: '#2b2b33' },
          { pos: 1.00, color: '#000000' },
        ];

        const hexToRgb = (hex) => {
          const value = hex.replace('#', '');
          const normalized = value.length === 3
            ? value.split('').map((part) => part + part).join('')
            : value;
          const number = parseInt(normalized, 16);
          return { r: (number >> 16) & 255, g: (number >> 8) & 255, b: number & 255 };
        };

        const rgbToHex = (r, g, b) => `#${[r, g, b]
          .map((value) => value.toString(16).padStart(2, '0')).join('')}`;

        const lerpColor = (first, second, amount) => {
          const a = hexToRgb(first);
          const b = hexToRgb(second);
          return rgbToHex(
            Math.round(a.r + (b.r - a.r) * amount),
            Math.round(a.g + (b.g - a.g) * amount),
            Math.round(a.b + (b.b - a.b) * amount),
          );
        };

        const getGradientColor = (progress) => {
          if (progress <= gradientStops[0].pos) return gradientStops[0].color;
          if (progress >= gradientStops[gradientStops.length - 1].pos) return gradientStops[gradientStops.length - 1].color;
          for (let index = 0; index < gradientStops.length - 1; index += 1) {
            const first = gradientStops[index];
            const second = gradientStops[index + 1];
            if (progress >= first.pos && progress <= second.pos) {
              return lerpColor(first.color, second.color, (progress - first.pos) / (second.pos - first.pos));
            }
          }
          return gradientStops[0].color;
        };

        const updateThemeColor = () => {
          const scrollTop = window.scrollY || window.pageYOffset || 0;
          const documentHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progress = documentHeight > 0 ? Math.min(Math.max(scrollTop / documentHeight, 0), 1) : 0;
          const color = getGradientColor(progress);
          document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-navbutton-color"]')
            .forEach((meta) => meta.setAttribute('content', color));
        };

        let ticking = false;
        const onScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(() => {
              updateThemeColor();
              ticking = false;
            });
            ticking = true;
          }
        };

        document.addEventListener('DOMContentLoaded', () => {
          updateThemeColor();
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('resize', updateThemeColor);
        });
      })();
    </script>
