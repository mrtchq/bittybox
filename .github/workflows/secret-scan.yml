name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for real secrets
        run: |
          set -euo pipefail
          # Real-secret patterns only. The public Firebase web API key
          # (AIza...) is browser-embedded and non-secret, so any line that
          # also contains "AIza" is explicitly allowed.
          CS='client_secret'
          PATTERNS=(
            're_[A-Za-z0-9]{20,}'
            'sk_live_[A-Za-z0-9]{16,}'
            'pk_live_[A-Za-z0-9]{16,}'
            "${CS}[=: ][^\"' ]+"
          )
          bad=0
          while IFS= read -r f; do
            [[ "$f" == docs/assets/* ]] && continue
            [[ "$f" == .github/* ]] && continue
            for p in "${PATTERNS[@]}"; do
              if grep -Eqn "$p" "$f" 2>/dev/null; then
                if grep -Eqn "$p" "$f" 2>/dev/null | grep -q 'AIza'; then
                  echo "  allow (public Firebase web key): $f"
                  continue
                fi
                echo "  REAL SECRET MATCH in $f:"
                grep -En "$p" "$f" 2>/dev/null | sed 's/^/    /' | cut -c1-120
                bad=1
              fi
            done
          done < <(git ls-files)
          if [ "$bad" -ne 0 ]; then
            echo "FAIL: real secret(s) detected"
            exit 1
          fi
          echo "OK: no real secrets in tracked source"
