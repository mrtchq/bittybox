[functions]
  external_node_modules = [
    "sharp"
  ]
  directory = "functions/"

[[edge_functions]]
  path = "/*"
  function = "metadata"

[[redirects]]
  from = "/test4"
  to = "/test4.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/render/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"
